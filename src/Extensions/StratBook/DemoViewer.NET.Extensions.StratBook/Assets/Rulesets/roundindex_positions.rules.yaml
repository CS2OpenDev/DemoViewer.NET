# yaml-language-server: $schema=../../../../../../rules/cs2demokit-rules.schema.json
#
# Round Index positions: every player once a second from each freeze end, the samples the round
# index folds into its rows and positions file. No until: a round with no end runs to the next
# freeze end, and the fold clips each round to its own window.
#
# A cadence step reads the frame it fires on, after that frame's entity fold. The weapon in hand,
# armour and money ride along for the Scouting Report; a dead player keeps the class of the weapon
# it last held, so a reader masks those columns with is_alive.
ruleset: net_demoviewer_pack_stratbook__roundindex_positions
title: Round Index Positions
summary: Each player's position, place, side, liveness, pawn index, weapon in hand, armour and money once a second, for the round index.
for: each_player

cadences:
  second: { seconds: 1, anchor: round_freeze_end }

stats:
  pos_x: { capture: player.pos_x, on: cadence.second, keep: last, per: match }
  pos_y: { capture: player.pos_y, on: cadence.second, keep: last, per: match }
  pos_z: { capture: player.pos_z, on: cadence.second, keep: last, per: match }
  place: { capture: player.place, on: cadence.second, keep: last, per: match }
  side: { capture: player.team, on: cadence.second, keep: last, per: match }
  is_alive: { capture: player.is_alive, on: cadence.second, keep: last, per: match }
  entity_index: { capture: player.entity_index, on: cadence.second, keep: last, per: match }
  weapon_class: { capture: player.active_weapon_class, on: cadence.second, keep: last, per: match }
  armor: { capture: player.armor, on: cadence.second, keep: last, per: match }
  money: { capture: player.money, on: cadence.second, keep: last, per: match }

show:
  tables:
    roundindex_positions:
      per: player_event
      on: cadence.second
      columns:
        - { stat: pos_x }
        - { stat: pos_y }
        - { stat: pos_z }
        - { stat: place }
        - { stat: side }
        - { stat: is_alive }
        - { stat: entity_index }
        - { stat: weapon_class }
        - { stat: armor }
        - { stat: money }
