# Tri-OS Velopack packaging matrix.
# Each OS builds its own self-contained bundle + installer (vpk cannot cross-build):
#   windows-latest → win-x64 Setup.exe · macos-14 (arm64) → osx-arm64 .app/.pkg · ubuntu → linux-x64 AppImage
#
# Triggered by a v* tag (a real release) or manually. A vX.Y.Z-betaNNNN tag is a beta: it packs into
# the <os>-beta channels and publishes as a GitHub prerelease, which only subscribed installs read.
# Cutting one:
#   1. Set version.json to X.Y.Z-betaNNNN (four digits; labels compare as text).
#   2. Get a completed, successful `ci` run on that exact commit: land it on main or a PR head, or
#      dispatch `ci` on the branch and let it finish. verify-ci accepts any of those and nothing less.
#   3. Tag vX.Y.Z-betaNNNN on that commit and push the tag.
# pack-velopack.sh refuses a tag that disagrees with version.json. main keeps stamping the beta
# version until the next bump.
#
# A release that moves CS2DemoKit needs the SDK released first (release-sdk.yml, an sdk/v* tag on the
# same pin). verify-sdk refuses the app until nuget.org serves it.
#
# Signing: the macOS build is signed with the maintainer's Developer ID and notarized on every v* tag,
# and on a manual run with `sign` on. Its job then runs in the `release-signing` environment, which
# holds the certificates and the notary key and needs an approval. Windows and Linux ship unsigned.
# Every published release also carries SHA256SUMS and a build provenance attestation per asset:
# `gh attestation verify <file> --repo CS2OpenDev/DemoViewer.NET`.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      beta:
        description: 'Pack into the <os>-beta channels'
        type: boolean
        default: false
      publish:
        description: 'Publish the GitHub Release. Off means pack only, which is what a dry run wants.'
        type: boolean
        default: false
      allow_sdk_drift:
        description: 'Emergency only: release even though nuget.org''s latest SDK declares another CS2DemoKit'
        type: boolean
        default: false
      sign:
        description: 'Sign and notarize the macOS build (runs in release-signing, which needs approval). Tags always sign.'
        type: boolean
        default: false

permissions:
  contents: write   # upload release assets when cut from a tag
  actions: read     # verify-ci lists ci.yml runs; declaring this block makes every omitted
                    # scope `none`, so without it that call 403s (it did, on the v0.5.2 tag)

jobs:
  # Gate: this tag's commit must already have a GREEN `ci` run. Publishing now feeds an in-app
  # updater, so an untested tag reaches users on its own — process discipline ("only tag commits
  # that went green on main") is no longer enough on its own.
  #
  # Deliberately a CHECK, not a re-run: `ci` builds the Desktop head and runs the parser suite on
  # every push to main, and re-running it here would double the work for the same answer. Note it
  # does NOT produce the release artifacts — the package matrix below builds those itself — so this
  # gate proves the commit is tested, not that it is already built.
  #
  # `ci` triggers on push-to-main, pull_request and workflow_dispatch, NOT on tags, so a tagged commit
  # with no completed `ci` run of its own fails here. That is the case worth catching. A dispatch on a
  # branch counts, which is how release-sdk and release-extension expect a dry run to clear this gate.
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful ci run for ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          # Distinguish "the API call failed" from "ci was not green". Both must block the
          # release, but conflating them is actively misleading: a 403 here once reported
          # "'ci' did not succeed" for a commit whose ci was green, sending the diagnosis
          # at the test suite instead of at a missing `actions: read` scope.
          if ! runs=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed" \
                        --jq '[.workflow_runs[].conclusion] | join(" ")' 2>&1); then
            echo "::error::Could not query ci runs for $sha — this is an API/permissions failure," >&2
            echo "         NOT a verdict on the tests. Response: $runs" >&2
            exit 1
          fi
          echo "ci conclusions for $sha: ${runs:-<none>}"
          if [ -z "$runs" ]; then
            echo "::error::No completed 'ci' run for $sha. Tag a commit that has landed on main and gone green." >&2
            exit 1
          fi
          case " $runs " in
            *" success "*) echo "ci is green for $sha — proceeding to package." ;;
            *) echo "::error::'ci' did not succeed for $sha (conclusions: $runs). Refusing to publish." >&2; exit 1 ;;
          esac

  # Gate: the latest SDK on nuget.org must declare the CS2DemoKit version this commit pins. The app
  # loads one CS2DemoKit for itself and every extension, so an SDK that declares another one builds
  # packs that compile and then fail to load. When CS2DemoKit moves, release the SDK first.
  # scripts/check-sdk-published.sh has the matching rule.
  #
  # A dry run (anything the publish job would skip) reports the verdict without failing. A tag push
  # cannot carry the override; to use it, dispatch against the tag with publish and allow_sdk_drift on.
  verify-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nbgv, for the SDK version the failure message names

      - uses: ./.github/actions/dotnet-sdk

      - name: Restore CLI tools (nbgv)
        run: dotnet tool restore

      - name: Require the published SDK to declare this CS2DemoKit pin
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
          ALLOW_SDK_DRIFT: ${{ github.event.inputs.allow_sdk_drift }}
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" != "true" ]; then
            echo "Dry run: reporting SDK drift without failing."
            bash scripts/check-sdk-published.sh --report-only
          elif [ "$ALLOW_SDK_DRIFT" = "true" ]; then
            echo "::warning::allow_sdk_drift is ON. This release skips the SDK lock-step gate and may ship a CS2DemoKit no published SDK declares."
            echo "### allow_sdk_drift was used: the SDK lock-step gate did not block this release" >> "$GITHUB_STEP_SUMMARY"
            bash scripts/check-sdk-published.sh --report-only
          else
            bash scripts/check-sdk-published.sh
          fi

  package:
    needs: [verify-ci, verify-sdk]
    strategy:
      fail-fast: false
      # `dotnet publish -r <rid>` flattens whatever CSVG natives the referenced Cs2VideoGenerator.Core
      # version carries for that RID; publish.sh only verifies they landed and WARNS on a miss (never
      # fatal on its own). Set DV_PUBLISH_STRICT_NATIVES=1 here to hard-fail the matrix on a genuine
      # missing native, once a green run's per-RID native list is trusted.
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-14
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    # Only the macOS leg waits on Apple, and a pack may submit the app and the installer
    # separately, so a slow notary queue can need hours. The other two never wait on anything.
    timeout-minutes: ${{ matrix.rid == 'osx-arm64' && 240 || 30 }}
    # Only a leg that signs enters release-signing, the environment that holds the signing material
    # and waits for an approval. The others, and every dry run without `sign`, run outside it, so they
    # see none of its secrets and need no approval. An empty name means no environment.
    environment: ${{ matrix.rid == 'osx-arm64' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && 'release-signing' || '' }}
    # Nothing in this job writes to the repository: the delta seed only downloads, and nbgv reads
    # local history. It holds the Developer ID keys while running every dependency's build code.
    permissions:
      contents: read
    env:
      DV_MAC_SIGN: ${{ matrix.rid == 'osx-arm64' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # Nerdbank.GitVersioning needs full history
          persist-credentials: false  # no step here talks to the remote; keep the token out of .git/config

      - uses: ./.github/actions/dotnet-sdk

      - name: Restore CLI tools (vpk, nbgv)
        run: dotnet tool restore

      # A throwaway keychain holding both Developer ID identities and the notarytool profile, deleted
      # at the end of the job. One .p12 per identity (Application, Installer), both under
      # MACOS_P12_PASSWORD. Everything is checked here, before vpk spends twenty minutes building.
      - name: Prepare the macOS signing keychain
        if: env.DV_MAC_SIGN == '1'
        env:
          APP_P12: ${{ secrets.MACOS_APP_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APP_IDENTITY: ${{ vars.MACOS_SIGN_APP_IDENTITY }}
          INSTALL_IDENTITY: ${{ vars.MACOS_SIGN_INSTALL_IDENTITY }}
        run: |
          set -euo pipefail
          for v in APP_P12 INSTALLER_P12 P12_PASSWORD API_KEY_P8 API_KEY_ID API_ISSUER_ID APP_IDENTITY INSTALL_IDENTITY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty. Set it on the release-signing environment." >&2
              exit 1
            fi
          done

          # notarytool only rejects a malformed issuer after the approval and the keychain import,
          # so check the shape here. Unquoted on the right of =~ or bash matches it literally.
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if ! [[ $API_ISSUER_ID =~ $uuid ]]; then
            echo "::error::APPLE_API_ISSUER_ID is not a UUID. It is the Issuer ID above the key list" >&2
            echo "::error::in App Store Connect (Users and Access, Integrations), not the Key ID." >&2
            exit 1
          fi

          # The decoded key files are the only plaintext copies on disk. umask before writing them,
          # and drop them on the way out of this step even when a command below fails.
          umask 077
          trap 'rm -f "$RUNNER_TEMP/identity.p12" "$RUNNER_TEMP/AuthKey.p8"' EXIT

          KC="$RUNNER_TEMP/dv-signing.keychain-db"
          KC_PW="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          # -x marks the keys non-extractable. codesign and productsign sign through the keychain, so
          # nothing later in this job (publish.sh runs every dependency's build code) can export them.
          for p12 in APP_P12 INSTALLER_P12; do
            printf '%s' "${!p12}" | base64 --decode > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$KC" -P "$P12_PASSWORD" -x \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm -f "$RUNNER_TEMP/identity.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          # Searched first, ahead of the login keychain, so codesign and productsign find these identities.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          identities="$(security find-identity -v "$KC")"
          echo "$identities"
          # find-identity quotes each name. Match the whole quoted name: a substring matches both
          # certificates, and codesign fails on an identity that resolves to more than one.
          for id in "$APP_IDENTITY" "$INSTALL_IDENTITY"; do
            if ! printf '%s\n' "$identities" | grep -qF "\"$id\""; then
              echo "::error::No identity named exactly '$id' in the imported certificates. This must be" >&2
              echo "::error::the full common name, as in 'Developer ID Application: Name (TEAMID)'. Check" >&2
              echo "::error::also that the Developer ID G2 intermediate was bundled into the .p12." >&2
              exit 1
            fi
          done

          printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials dv-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --keychain "$KC"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

          {
            echo "DV_MAC_KEYCHAIN=$KC"
            echo "DV_MAC_NOTARY_PROFILE=dv-notary"
            echo "DV_MAC_SIGN_APP_IDENTITY=$APP_IDENTITY"
            echo "DV_MAC_SIGN_INSTALL_IDENTITY=$INSTALL_IDENTITY"
            echo "DV_REQUIRE_SIGNING=1"
          } >> "$GITHUB_ENV"

      - name: Pack (${{ matrix.rid }})
        shell: bash   # git-bash on the Windows runner; the pack script is bash
        env:
          # Seed the output dir with the currently-published release so vpk emits a delta alongside
          # the full package. Opt-in so local `pack-velopack.sh` runs stay offline and deterministic.
          # A missing/failed download is non-fatal: full-only is a correct release. Before the first
          # release exists this 404s, the seeding step swallows it, and the release ships full-only.
          # Tag builds only. A manual run's branch version sorts below the published release, and vpk
          # refuses to pack below a release already in the output dir.
          DV_DELTA_SEED: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          DV_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # The feed is public, but unauthenticated API calls from shared runners hit GitHub's rate
          # limit (403), which silently turned releases full-only.
          DV_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag builds detect beta from the stamped version; this only forces it for a manual run.
          DV_BETA: ${{ inputs.beta && '1' || '0' }}
        run: ./scripts/pack-velopack.sh ${{ matrix.rid }}

      # vpk reports success when notarization succeeds, but this is what a user's Mac checks, so the
      # release does not leave the runner unless Apple's own tools accept the installer and the app.
      - name: Verify the macOS signature and notarization
        if: env.DV_MAC_SIGN == '1'
        shell: bash
        run: |
          set -euo pipefail
          REL="artifacts/velopack/${{ matrix.rid }}"
          # A glob, not `ls | head`: that pipeline can exit non-zero on SIGPIPE under pipefail.
          pkgs=("$REL"/*.pkg); pkg="${pkgs[0]}"
          zips=("$REL"/*Portable.zip); zip="${zips[0]}"
          for f in "$pkg" "$zip"; do
            if [ ! -f "$f" ]; then
              echo "::error::expected a .pkg and a *Portable.zip in $REL; found: $(echo "$REL"/* )" >&2
              exit 1
            fi
          done

          pkgutil --check-signature "$pkg"
          spctl --assess -vvv --type install "$pkg" 2>&1 | tee "$RUNNER_TEMP/spctl-pkg.txt"
          grep -q "Notarized Developer ID" "$RUNNER_TEMP/spctl-pkg.txt"
          xcrun stapler validate "$pkg"

          app_dir="$RUNNER_TEMP/verify-app"
          rm -rf "$app_dir" && mkdir -p "$app_dir"
          ditto -x -k "$zip" "$app_dir"
          app="$(find "$app_dir" -maxdepth 2 -name '*.app' | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess -vvv --type execute "$app" 2>&1 | tee "$RUNNER_TEMP/spctl-app.txt"
          grep -q "Notarized Developer ID" "$RUNNER_TEMP/spctl-app.txt"
          # Informational: the entitlements vpk applied, and whether the app carries its own ticket.
          codesign -d --entitlements - "$app" || true
          xcrun stapler validate "$app" || echo "::notice::the portable app has no stapled ticket; Gatekeeper fetches it online"

      - name: Remove the signing keychain
        if: always() && env.DV_MAC_SIGN == '1'
        run: security delete-keychain "$RUNNER_TEMP/dv-signing.keychain-db" || true

      # No build-path scan here by design — it was tried and removed. scripts/scan-release-artifacts.py
      # still exists and is run manually against a pack before a release goes public.
      #
      # Why it is not wired in: on Windows it flagged DemoViewer.NET.Desktop_ExecutionStub.exe, which
      # is not ours. vpk copies its own prebuilt vendor/stub.exe and renames it after the app, so a
      # first-party name pattern claims a Velopack binary. Its 85 C:\Users\ hits are
      # C:\Users\runneradmin\.rustup\... — Velopack's runner building their Rust stub, verified byte
      # for byte against vpk 1.2.0's vendor/stub.exe. Zero of ours.
      #
      # The real protection is upstream of packaging anyway: ContinuousIntegrationBuild in
      # Directory.Build.props normalizes first-party paths to /_/ on every Release build, and the
      # two leaking dependencies (CS2OpenDev.Sdk and Cs2VideoGenerator.Core) were fixed at source.
      # A per-release gate on top of that bought a false positive.

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.rid }}
          path: artifacts/velopack/${{ matrix.rid }}/

  # Publish one GitHub Release (per tag) with all three OSes' Velopack installers + auto-update
  # feeds attached. Tag-only: workflow_dispatch runs just build+upload artifacts (no Release), so
  # the matrix stays usable for CI validation without publishing. `vpk upload github --merge` lets
  # each OS channel (win/osx/linux) land in the same release; the first creates it, the rest merge.
  publish:
    needs: package
    # The ref alone is not enough. workflow_dispatch can select a TAG, so a manual run against an
    # existing v* tag used to satisfy this gate and upload into that live release with no opt-in.
    # A tag push is always a real release; a dispatch must say so. inputs.publish is the string
    # "true" or "false" on a dispatch and empty otherwise, so compare against 'true'.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release + upload assets
      id-token: write       # attest-build-provenance signs through Sigstore with this job's OIDC identity
      attestations: write   # and stores the attestations on the repository
    steps:
      - uses: actions/checkout@v4   # for .config/dotnet-tools.json (vpk)

      - uses: ./.github/actions/dotnet-sdk

      - name: Restore CLI tools (vpk)
        run: dotnet tool restore

      - name: Download all Velopack packages
        uses: actions/download-artifact@v4
        with:
          path: dist   # -> dist/velopack-<rid>/<packages + releases.<channel>.json>

      - name: Publish GitHub Release (Velopack, all channels)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.server_url }}/${{ github.repository }}"
          tag="${{ github.ref_name }}"
          case "$tag" in
            *-beta*) pre=true ;;
            *)       pre=false ;;
          esac
          for rid in win-x64 osx-arm64 linux-x64; do
            dir="dist/velopack-$rid"
            # Derive the channel from the feed file vpk produced (win/osx/linux, or <os>-beta). Don't hardcode.
            feed=$(ls "$dir"/releases.*.json 2>/dev/null | head -1 || true)
            if [ -z "$feed" ]; then
              echo "::warning::no Velopack feed in $dir — skipping $rid"; continue
            fi
            ch=$(basename "$feed" | sed 's/^releases\.//; s/\.json$//')
            case "$ch" in
              *-beta) [ "$pre" = true ] || { echo "::error::beta feed $ch on non-beta tag $tag" >&2; exit 1; } ;;
              *)      [ "$pre" = false ] || { echo "::error::stable feed $ch on beta tag $tag" >&2; exit 1; } ;;
            esac
            echo "Uploading $rid (channel=$ch, prerelease=$pre) to release $tag"
            dotnet vpk upload github \
              --outputDir "$dir" \
              --channel "$ch" \
              --repoUrl "$repo" \
              --token "$GH_TOKEN" \
              --tag "$tag" \
              --releaseName "DemoViewer.NET $tag" \
              --publish true \
              --pre "$pre" \
              --merge true
          done

      # From the release itself, not from dist/: dist also holds the previous release's packages that
      # delta seeding downloaded, and the point is to vouch for exactly what a user can download.
      - name: Checksum the release's assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          dir="$RUNNER_TEMP/release-assets"
          rm -rf "$dir" && mkdir -p "$dir"
          gh release download "$tag" --repo "${{ github.repository }}" --dir "$dir"
          rm -f "$dir/SHA256SUMS"   # a re-run's earlier copy
          (cd "$dir" && sha256sum -- * > SHA256SUMS)
          cat "$dir/SHA256SUMS"
          gh release upload "$tag" "$dir/SHA256SUMS" --repo "${{ github.repository }}" --clobber
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Attest the release's assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.assets.outputs.dir }}/*

      # Stable notes are hand-written in release-body.md before tagging. Beta notes are fixed text plus
      # a compare link against the latest full release, so a beta needs no notes edit to ship.
      - name: Set release notes (guide users to the right installer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          notes=.github/release-body.md
          case "$tag" in
            *-beta*)
              notes="$RUNNER_TEMP/release-body-beta.md"
              changes=""
              # Newest full app release. Not releases/latest: extension releases share this repo.
              base=$(gh release list --repo "${{ github.repository }}" --exclude-pre-releases --limit 50 \
                       --json tagName,createdAt \
                       --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.createdAt) | last | .tagName // empty' \
                       2>/dev/null || true)
              if [ -n "$base" ]; then
                changes="**Changes since $base:** ${{ github.server_url }}/${{ github.repository }}/compare/$base...$tag"
              fi
              # awk, not sed: the URL is full of slashes.
              awk -v c="$changes" '$0 == "<!-- changes -->" { print c; next } { print }' \
                .github/release-body-beta.md > "$notes"
              ;;
          esac
          gh release edit "$tag" \
            --repo "${{ github.repository }}" \
            --notes-file "$notes"
